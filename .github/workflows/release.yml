name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package each platform build
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            if [[ "$name" == *windows* ]]; then
              (cd "$name" && zip -r "../${name}.zip" .)
            else
              # tar.gz (not zip) preserves the Unix executable bit on extraction
              chmod +x "$name/DungeonSlime"
              tar -czf "${name}.tar.gz" -C "$name" .
            fi
          done

      - name: Attach archives to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/*.zip artifacts/*.tar.gz --repo ${{ github.repository }} --clobber
